<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>البث المباشر - الفجر 1</title>
  <!-- مكتبة تشغيل فيديو HLS -->
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    .video-js {
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
</head>
<body>

  <video 
    id="live-stream" 
    class="video-js vjs-default-skin vjs-big-play-centered" 
    controls 
    autoplay 
    preload="auto" 
    playsinline>
    <!-- رابط سيرفر البث المباشر لقناة الفجر -->
    <source src="https://stream.alfajertv.com/fajer1/live/playlist.m3u8" type="application/x-mpegURL">
    متصفحك لا يدعم تشغيل هذا البث.
  </video>

  <script>
    var player = videojs('live-stream');
    player.ready(function() {
      player.play();
    });
  </script>

</body>
</html>
