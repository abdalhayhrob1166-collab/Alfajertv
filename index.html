<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البث المباشر</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    .stream-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .stream-wrapper iframe {
      position: absolute;
      /* إزاحة لإخفاء الشريط العلوي وشريط التنقل الخاص بموقع المصدر */
      top: -50px; 
      left: 0;
      width: 100vw;
      height: calc(100vh + 50px);
      border: 0;
    }
  </style>
</head>
<body>

  <div class="stream-wrapper">
    <iframe 
      src="https://tv.alfajertv.com/?channel=fajer1" 
      allow="autoplay; fullscreen"
      allowfullscreen="true" 
      scrolling="no">
    </iframe>
  </div>

</body>
</html>
