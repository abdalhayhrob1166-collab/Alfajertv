<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلفزيون الفجر - البث المباشر</title>
    <link href="https://cdn.plyr.io/3.7.8/plyr.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-wrapper {
            max-width: 1000px;
            width: 100%;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .player-header {
            text-align: center;
            padding: 16px;
            font-size: 1.4em;
            font-weight: 700;
            background: linear-gradient(145deg, #430d45 0%, #2e0931 100%);
            border-bottom: 2px solid rgba(67, 13, 69, 0.3);
        }
        #player-container {
            width: 100%;
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .plyr {
            width: 100%;
            height: 100%;
        }
        .plyr__video-wrapper {
            width: 100%;
            height: 100%;
        }
        .plyr video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2em;
            color: #fff;
            background: rgba(0,0,0,0.85);
            padding: 17px 34px;
            border-radius: 8px;
            z-index: 10;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #loading-indicator .icon {
            font-size: 2.5em;
            display: block;
            margin-bottom: 10px;
        }
        #loading-indicator .sub {
            font-size: 0.7em;
            opacity: 0.6;
            margin-top: 6px;
        }
        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.8em;
            color: #8b949e;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .footer a {
            color: #8b949e;
            text-decoration: none;
        }
        .footer a:hover {
            color: #fff;
        }
        .channel-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .channel-btn {
            background: linear-gradient(145deg, #21262d 0%, #161b22 100%);
            border: 2px solid #30363d;
            color: #c9d1d9;
            padding: 8px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .channel-btn:hover {
            background: linear-gradient(145deg, #430d45 0%, #2e0931 100%);
            border-color: #430d45;
            color: #fff;
        }
        .channel-btn.active {
            background: linear-gradient(145deg, #430d45 0%, #2e0931 100%);
            border-color: #6b1a6e;
            box-shadow: 0 0 25px rgba(67, 13, 69, 0.6);
            color: #fff;
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .player-header { font-size: 1.1em; padding: 12px; }
        }
        @media (max-width: 480px) {
            body { padding: 5px; }
            .player-header { font-size: 0.95em; padding: 10px; }
            .channel-btn { padding: 6px 12px; font-size: 0.8em; }
            #loading-indicator { font-size: 1em; padding: 14px 22px; }
        }
        /* Fullscreen fixes */
        #player-container:fullscreen,
        #player-container:-webkit-full-screen,
        #player-container:-moz-full-screen,
        #player-container:-ms-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            aspect-ratio: unset !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .plyr:fullscreen,
        .plyr:-webkit-full-screen,
        .plyr:-moz-full-screen,
        .plyr:-ms-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            aspect-ratio: unset !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .plyr:fullscreen .plyr__video-wrapper,
        .plyr:-webkit-full-screen .plyr__video-wrapper,
        .plyr:-moz-full-screen .plyr__video-wrapper,
        .plyr:-ms-fullscreen .plyr__video-wrapper {
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            max-width: 100vw !important;
        }
        .plyr:fullscreen video,
        .plyr:-webkit-full-screen video,
        .plyr:-moz-full-screen video,
        .plyr:-ms-fullscreen video,
        #player-container:fullscreen video {
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            max-width: 100vw !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <div class="player-header">📺 تلفزيون الفجر - البث المباشر</div>
        <div id="player-container">
            <div id="loading-indicator">
                <div class="icon">⏳</div>
                <div id="status-text">جاري تحميل البث...</div>
                <div class="sub">الرجاء الانتظار</div>
            </div>
            <video id="player" playsinline></video>
        </div>
        <div class="channel-selector">
            <button class="channel-btn active" data-channel="fajer1">الفجر 1</button>
            <button class="channel-btn" data-channel="fajer2">الفجر 2</button>
            <button class="channel-btn" data-channel="fajer3">الفجر 3</button>
            <button class="channel-btn" data-channel="fajer4">الفجر 4</button>
            <button class="channel-btn" data-channel="fajer5">الفجر 5</button>
        </div>
        <div class="footer">
            &copy; 2025 تلفزيون الفجر - <a href="https://alfajertv.com" target="_blank">alfajertv.com</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        (function() {
            console.log('[STREAM] بدء التشغيل مع الرابط المباشر...');

            // ============================================================
            // 🔴 الروابط المباشرة (تم استخراجها من الموقع)
            // ============================================================
            const STREAMS = {
                'fajer1': 'https://vstream4.hadara.ps:8443/AlfajertvHD1_web/web/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9OC8yNy8yMDI2IDc6MDI6MjYgQU0maGFzaF92YWx1ZT1qSTlRKzJHeVVJNjZxZ2NMZWdrWHFnPT0mdmFsaWRtaW51dGVzPTE4MCZpZD11bTI5dXNwcmZzZ2UwdWwwbTE0aHUycTRkaA==',
                'fajer2': 'https://vstream4.hadara.ps:8443/AlfajertvHD2_web/web/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9OC8yNy8yMDI2IDc6MDI6MjYgQU0maGFzaF92YWx1ZT1qSTlRKzJHeVVJNjZxZ2NMZWdrWHFnPT0mdmFsaWRtaW51dGVzPTE4MCZpZD11bTI5dXNwcmZzZ2UwdWwwbTE0aHUycTRkaA==',
                'fajer3': 'https://vstream4.hadara.ps:8443/AlfajertvHD3_web/web/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9OC8yNy8yMDI2IDc6MDI6MjYgQU0maGFzaF92YWx1ZT1qSTlRKzJHeVVJNjZxZ2NMZWdrWHFnPT0mdmFsaWRtaW51dGVzPTE4MCZpZD11bTI5dXNwcmZzZ2UwdWwwbTE0aHUycTRkaA==',
                'fajer4': 'https://vstream4.hadara.ps:8443/AlfajertvHD4_web/web/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9OC8yNy8yMDI2IDc6MDI6MjYgQU0maGFzaF92YWx1ZT1qSTlRKzJHeVVJNjZxZ2NMZWdrWHFnPT0mdmFsaWRtaW51dGVzPTE4MCZpZD11bTI5dXNwcmZzZ2UwdWwwbTE0aHUycTRkaA==',
                'fajer5': 'https://vstream4.hadara.ps:8443/AlfajertvHD5_web/web/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9OC8yNy8yMDI2IDc6MDI6MjYgQU0maGFzaF92YWx1ZT1qSTlRKzJHeVVJNjZxZ2NMZWdrWHFnPT0mdmFsaWRtaW51dGVzPTE4MCZpZD11bTI5dXNwcmZzZ2UwdWwwbTE0aHUycTRkaA=='
            };

            let currentChannel = 'fajer1';
            let hls = null;
            let player = null;
            let isPlaying = false;
            let retryCount = 0;
            const MAX_RETRIES = 3;

            const videoEl = document.getElementById('player');
            const loadingEl = document.getElementById('loading-indicator');
            const statusText = document.getElementById('status-text');

            // ============================================================
            // 1. تهيئة المشغل
            // ============================================================
            function initPlayer(url) {
                console.log('[STREAM] تحميل الرابط:', url.substring(0, 100) + '...');

                loadingEl.style.display = 'block';
                statusText.textContent = 'جاري تحميل البث...';

                if (Hls.isSupported()) {
                    if (hls) {
                        hls.destroy();
                        hls = null;
                    }

                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: false,
                        liveSyncDurationCount: 8,
                        maxBufferLength: 60,
                        backBufferLength: 90,
                        // إضافة رؤوس إضافية
                        xhrSetup: function(xhr, url) {
                            xhr.setRequestHeader('Referer', 'https://tv.alfajertv.com/');
                            xhr.setRequestHeader('Origin', 'https://tv.alfajertv.com');
                            xhr.withCredentials = true;
                        }
                    });

                    hls.loadSource(url);
                    hls.attachMedia(videoEl);

                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        console.log('[STREAM] ✅ تم تحميل البث بنجاح');
                        loadingEl.style.display = 'none';
                        retryCount = 0;

                        if (!player) {
                            player = new Plyr(videoEl, {
                                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                                autoplay: true,
                                hideControls: true
                            });
                            isPlaying = true;

                            // أحداث fullscreen
                            player.on('enterfullscreen', () => {
                                setTimeout(() => {
                                    const container = document.getElementById('player-container');
                                    if (container) {
                                        container.style.position = 'fixed';
                                        container.style.top = '0';
                                        container.style.left = '0';
                                        container.style.right = '0';
                                        container.style.bottom = '0';
                                        container.style.width = '100vw';
                                        container.style.height = '100vh';
                                        container.style.aspectRatio = 'unset';
                                        container.style.margin = '0';
                                        container.style.padding = '0';
                                    }
                                }, 100);
                            });

                            player.on('exitfullscreen', () => {
                                const container = document.getElementById('player-container');
                                if (container) {
                                    container.style.position = '';
                                    container.style.top = '';
                                    container.style.left = '';
                                    container.style.right = '';
                                    container.style.bottom = '';
                                    container.style.width = '';
                                    container.style.height = '';
                                    container.style.aspectRatio = '';
                                    container.style.margin = '';
                                    container.style.padding = '';
                                }
                            });
                        }

                        videoEl.play().catch(e => {
                            console.warn('[STREAM] تشغيل تلقائي غير مسموح:', e.message);
                            // محاولة التشغيل عند تفاعل المستخدم
                            document.addEventListener('click', function playOnClick() {
                                videoEl.play().catch(() => {});
                                document.removeEventListener('click', playOnClick);
                            }, { once: true });
                        });
                    });

                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.error('[STREAM] ❌ خطأ:', data);
                        
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                if (retryCount < MAX_RETRIES) {
                                    retryCount++;
                                    statusText.textContent = `جاري إعادة المحاولة (${retryCount}/${MAX_RETRIES})...`;
                                    console.log(`[STREAM] محاولة إعادة الاتصال (${retryCount}/${MAX_RETRIES})`);
                                    setTimeout(() => {
                                        hls.startLoad();
                                    }, 3000 * retryCount);
                                } else {
                                    showError('تعذر تحميل البث - تأكد من اتصالك بالإنترنت');
                                }
                            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                hls.recoverMediaError();
                            } else {
                                hls.destroy();
                                showError('تعذر تحميل البث - حاول لاحقاً');
                            }
                        }
                    });

                } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari
                    videoEl.src = url;
                    if (!player) {
                        player = new Plyr(videoEl, {
                            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                            autoplay: true,
                            hideControls: true
                        });
                        isPlaying = true;
                    }
                    loadingEl.style.display = 'none';
                    videoEl.play().catch(e => console.warn('[STREAM] تشغيل تلقائي غير مسموح:', e.message));
                } else {
                    showError('المتصفح لا يدعم تشغيل البث المباشر');
                }
            }

            // ============================================================
            // 2. عرض رسائل الخطأ
            // ============================================================
            function showError(message) {
                loadingEl.innerHTML = `
                    <div class="icon">⚠️</div>
                    <div>${message}</div>
                    <div class="sub">حاول تحديث الصفحة أو استخدم مشغل آخر</div>
                    <button onclick="location.reload()" style="margin-top:15px;padding:8px 20px;background:#430d45;border:none;color:#fff;border-radius:5px;cursor:pointer;font-size:0.9em;">إعادة المحاولة</button>
                `;
                loadingEl.style.display = 'block';
                statusText.textContent = message;
            }

            // ============================================================
            // 3. تبديل القناة
            // ============================================================
            function switchChannel(channel) {
                if (channel === currentChannel && isPlaying) {
                    console.log('[STREAM] القناة نفسها، لا حاجة للتبديل');
                    return;
                }

                currentChannel = channel;
                console.log('[STREAM] تبديل إلى القناة:', channel);

                document.querySelectorAll('.channel-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.channel === channel);
                });

                let url = STREAMS[channel];
                if (!url) {
                    showError('لا يوجد رابط لهذه القناة');
                    return;
                }

                retryCount = 0;
                initPlayer(url);
            }

            // ============================================================
            // 4. بدء التشغيل
            // ============================================================
            function start() {
                const url = STREAMS[currentChannel];
                if (!url) {
                    showError('لا يوجد رابط للقناة المحددة');
                    return;
                }
                initPlayer(url);
            }

            // ============================================================
            // 5. إعداد الأزرار
            // ============================================================
            document.querySelectorAll('.channel-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    switchChannel(this.dataset.channel);
                });
            });

            // ============================================================
            // 6. بدء التشغيل
            // ============================================================
            start();

            // إعادة المحاولة عند فقدان الاتصال
            window.addEventListener('online', () => {
                console.log('[STREAM] استعادة الاتصال، إعادة المحاولة...');
                if (!isPlaying) {
                    retryCount = 0;
                    start();
                }
            });

        })();
    </script>
</body>
</html>
