<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>تلفزيون الفجر - البث المباشر</title>
    <link href="https://cdn.plyr.io/3.7.8/plyr.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background: #0d1117;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-wrapper {
            max-width: 1000px;
            width: 100%;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .player-header {
            text-align: center;
            padding: 16px;
            font-size: 1.4em;
            font-weight: 700;
            background: linear-gradient(145deg, #430d45 0%, #2e0931 100%);
            border-bottom: 2px solid rgba(67, 13, 69, 0.3);
            letter-spacing: 1px;
        }
        #player-container {
            width: 100%;
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .plyr {
            width: 100%;
            height: 100%;
        }
        .plyr__video-wrapper {
            width: 100%;
            height: 100%;
        }
        .plyr video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2em;
            color: #fff;
            background: rgba(0,0,0,0.85);
            padding: 17px 34px;
            border-radius: 8px;
            z-index: 10;
            text-align: center;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #loading-indicator .icon {
            font-size: 2.5em;
            display: block;
            margin-bottom: 10px;
        }
        #loading-indicator .sub {
            font-size: 0.7em;
            opacity: 0.6;
            margin-top: 6px;
        }
        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.8em;
            color: #8b949e;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .footer a {
            color: #8b949e;
            text-decoration: none;
        }
        .footer a:hover {
            color: #fff;
        }

        /* fullscreen fixes */
        #player-container:fullscreen,
        #player-container:-webkit-full-screen,
        #player-container:-moz-full-screen,
        #player-container:-ms-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            aspect-ratio: unset !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .plyr:fullscreen,
        .plyr:-webkit-full-screen,
        .plyr:-moz-full-screen,
        .plyr:-ms-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            aspect-ratio: unset !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .plyr:fullscreen .plyr__video-wrapper,
        .plyr:-webkit-full-screen .plyr__video-wrapper,
        .plyr:-moz-full-screen .plyr__video-wrapper,
        .plyr:-ms-fullscreen .plyr__video-wrapper {
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            max-width: 100vw !important;
        }
        .plyr:fullscreen video,
        .plyr:-webkit-full-screen video,
        .plyr:-moz-full-screen video,
        .plyr:-ms-fullscreen video,
        #player-container:fullscreen video {
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            max-width: 100vw !important;
            object-fit: cover !important;
        }
        /* Plyr custom colors */
        .plyr--video .plyr__control.plyr__tab-focus,
        .plyr--video .plyr__control:hover,
        .plyr--video .plyr__control[aria-expanded=true] { background: #73266e !important; }
        .plyr__control--overlaid { background: rgba(115, 38, 110, 0.8) !important; }
        .plyr--full-ui input[type=range] { color: #73266e !important; }
        .plyr__progress__buffer { color: rgba(115, 38, 110, 0.25) !important; }
        .plyr--video .plyr__progress__buffer { background: rgba(115, 38, 110, 0.25) !important; }
        .plyr__time,
        .plyr__time--current,
        .plyr__time--duration { color: #ffffff !important; }
        .plyr--full-ui.plyr--video .plyr__controls { background: linear-gradient(transparent, rgba(0, 0, 0, 0.7)); }
        .plyr__menu__container .plyr__control[role=menuitemradio][aria-checked=true]::before { background: #73266e !important; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .player-header { font-size: 1.1em; padding: 12px; }
        }
        @media (max-width: 480px) {
            body { padding: 5px; }
            .player-header { font-size: 0.95em; padding: 10px; }
            #loading-indicator { font-size: 1em; padding: 14px 22px; }
        }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <div class="player-header">📺 تلفزيون الفجر - البث المباشر</div>
        <div id="player-container">
            <div id="loading-indicator">
                <div class="icon">⏳</div>
                <div>جاري تحميل البث...</div>
                <div class="sub">الرجاء الانتظار</div>
            </div>
            <video id="player" playsinline></video>
        </div>
        <div class="footer">
            &copy; 2025 تلفزيون الفجر - <a href="https://alfajertv.com" target="_blank">alfajertv.com</a>
        </div>
    </div>

    <!-- Plyr & HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        (function(){
            console.log('[STREAM] تشغيل البث المباشر - مشغل 1 (Plyr + HLS)');

            const CHANNEL = 'fajer1';
            let hls = null;
            let player = null;
            let playerInitialized = false;

            const videoEl = document.getElementById('player');
            const loadingEl = document.getElementById('loading-indicator');

            // ============================================================
            // 1. نجلب الرابط من API (نفس طريقة الموقع الأصلي)
            // ============================================================
            function getStreamUrl(channel) {
                return fetch(`api/get-stream.php?t=${Date.now()}`, {
                    credentials: 'include',
                    cache: 'no-store'
                })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    if (data.success && data.streams && data.streams[channel]) {
                        return data.streams[channel];
                    }
                    throw new Error('لا يوجد رابط للقناة');
                });
            }

            // ============================================================
            // 2. تهيئة المشغل
            // ============================================================
            function initPlayer(streamUrl) {
                if (playerInitialized) {
                    if (hls && typeof hls.loadSource === 'function') {
                        hls.loadSource(streamUrl);
                        hls.startLoad();
                    }
                    loadingEl.style.display = 'none';
                    return;
                }

                console.log('[STREAM] تهيئة المشغل...');

                if (Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: false,
                        liveSyncDurationCount: 8,
                        maxBufferLength: 60,
                        backBufferLength: 90
                    });

                    hls.loadSource(streamUrl);
                    hls.attachMedia(videoEl);

                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        console.log('[STREAM] تم تحميل البث');
                        loadingEl.style.display = 'none';

                        if (!player) {
                            player = new Plyr(videoEl, {
                                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                                autoplay: true,
                                hideControls: true
                            });

                            player.on('enterfullscreen', () => {
                                setTimeout(() => {
                                    const container = document.getElementById('player-container');
                                    if (container) {
                                        container.style.position = 'fixed';
                                        container.style.top = '0';
                                        container.style.left = '0';
                                        container.style.right = '0';
                                        container.style.bottom = '0';
                                        container.style.width = '100vw';
                                        container.style.height = '100vh';
                                        container.style.aspectRatio = 'unset';
                                        container.style.margin = '0';
                                        container.style.padding = '0';
                                    }
                                }, 100);
                            });
                            player.on('exitfullscreen', () => {
                                const container = document.getElementById('player-container');
                                if (container) {
                                    container.style.position = '';
                                    container.style.top = '';
                                    container.style.left = '';
                                    container.style.right = '';
                                    container.style.bottom = '';
                                    container.style.width = '';
                                    container.style.height = '';
                                    container.style.aspectRatio = '';
                                    container.style.margin = '';
                                    container.style.padding = '';
                                }
                            });

                            playerInitialized = true;
                        }

                        videoEl.play().catch(e => console.warn('[STREAM] تشغيل تلقائي غير مسموح:', e.message));
                    });

                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.error('[STREAM] خطأ في البث:', data);
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                console.log('[STREAM] محاولة إعادة الاتصال...');
                                hls.startLoad();
                            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                hls.recoverMediaError();
                            } else {
                                hls.destroy();
                                // ============================================================
                                // *** نعرض رسالة "تعذر تحميل البث" هنا ***
                                // ============================================================
                                loadingEl.innerHTML = `
                                    <div class="icon">⚠️</div>
                                    <div>تعذر تحميل البث</div>
                                    <div class="sub">حاول لاحقاً</div>
                                `;
                                loadingEl.style.display = 'block';
                                console.error('[STREAM] فشل البث بشكل نهائي');
                            }
                        }
                    });
                } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari native HLS
                    videoEl.src = streamUrl;
                    player = new Plyr(videoEl, {
                        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                        autoplay: true,
                        hideControls: true
                    });
                    playerInitialized = true;
                    loadingEl.style.display = 'none';
                    videoEl.play().catch(e => console.warn('[STREAM] تشغيل تلقائي غير مسموح:', e.message));
                } else {
                    // ============================================================
                    // *** HLS غير مدعوم → نعرض الرسالة ***
                    // ============================================================
                    loadingEl.innerHTML = `
                        <div class="icon">⚠️</div>
                        <div>تعذر تحميل البث</div>
                        <div class="sub">حاول لاحقاً</div>
                    `;
                    loadingEl.style.display = 'block';
                    console.error('[STREAM] HLS غير مدعوم');
                }

                // أحداث fullscreen العامة
                document.addEventListener('fullscreenchange', () => {
                    if (!document.fullscreenElement) {
                        const container = document.getElementById('player-container');
                        if (container) {
                            container.style.position = '';
                            container.style.top = '';
                            container.style.left = '';
                            container.style.right = '';
                            container.style.bottom = '';
                            container.style.width = '';
                            container.style.height = '';
                            container.style.aspectRatio = '';
                            container.style.margin = '';
                            container.style.padding = '';
                        }
                    }
                });
                document.addEventListener('webkitfullscreenchange', () => {
                    if (!document.webkitFullscreenElement) {
                        const container = document.getElementById('player-container');
                        if (container) {
                            container.style.position = '';
                            container.style.top = '';
                            container.style.left = '';
                            container.style.right = '';
                            container.style.bottom = '';
                            container.style.width = '';
                            container.style.height = '';
                            container.style.aspectRatio = '';
                            container.style.margin = '';
                            container.style.padding = '';
                        }
                    }
                });
            }

            // ============================================================
            // 3. البدء: نعرض "جاري التحميل" ثم نحاول جلب الرابط
            //    في حال أي فشل → نعرض "تعذر تحميل البث"
            // ============================================================
            loadingEl.innerHTML = `
                <div class="icon">⏳</div>
                <div>جاري تحميل البث...</div>
                <div class="sub">الرجاء الانتظار</div>
            `;
            loadingEl.style.display = 'block';

            getStreamUrl(CHANNEL)
                .then(url => {
                    console.log('[STREAM] تم جلب الرابط:', url);
                    initPlayer(url);
                })
                .catch(err => {
                    console.error('[STREAM] فشل جلب الرابط:', err);
                    // ============================================================
                    // *** فشل جلب الرابط → نعرض الرسالة المطلوبة ***
                    // ============================================================
                    loadingEl.innerHTML = `
                        <div class="icon">⚠️</div>
                        <div>تعذر تحميل البث</div>
                        <div class="sub">حاول لاحقاً</div>
                    `;
                    loadingEl.style.display = 'block';
                });

        })();
    </script>
</body>
</html>
