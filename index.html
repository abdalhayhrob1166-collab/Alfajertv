<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البث المباشر</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      padding-bottom: 56.25%; /* نسبة أبعاد 16:9 */
      height: 0;
      overflow: hidden;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <iframe 
      src="https://tv.alfajertv.com/?channel=fajer1" 
      allowfullscreen="true" 
      scrolling="no">
    </iframe>
  </div>

</body>
</html>
